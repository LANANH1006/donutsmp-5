name: Build mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.12

      - name: Build
        run: |
          # tim thu muc co settings.gradle (dung ca khi push ca thu muc donutlike/ hay noi dung ben trong)
          DIR=$(dirname "$(find . -name settings.gradle -not -path './.git/*' | head -1)")
          echo "Project dir: $DIR"
          cd "$DIR"
          gradle build --no-daemon
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/libs/*.jar "$GITHUB_WORKSPACE/out/"
          rm -f "$GITHUB_WORKSPACE"/out/*-sources.jar
          ls -la "$GITHUB_WORKSPACE/out"

      - uses: actions/upload-artifact@v4
        with:
          name: donutlike-mod
          path: out/*.jar

      - name: Release (khi push tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.jar
